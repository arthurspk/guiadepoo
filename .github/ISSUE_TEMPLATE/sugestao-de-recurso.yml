name: 💡 Sugestão de recurso
description: Sugira um curso, livro, canal, ferramenta, artigo ou comunidade para o guia.
title: "[Recurso]: "
labels: ["sugestão"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado pela sugestão! Leia os critérios em [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) antes de enviar. Só aceitamos conteúdo legal e com link funcionando.
  - type: input
    id: nome
    attributes:
      label: Nome do recurso
      placeholder: "Ex.: Curso de POO em Java — do zero aos design patterns"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL
      placeholder: "https://..."
    validations:
      required: true
  - type: dropdown
    id: categoria
    attributes:
      label: Categoria
      options:
        - Roadmap
        - Por onde começar
        - Cursos gratuitos
        - Cursos pagos
        - Documentação oficial
        - Sites e cursos por linguagem (Java, Python, C#, PHP)
        - Padrões de projeto
        - Livros
        - Canais no YouTube
        - Sites, blogs e newsletters
        - Ferramentas
        - Projetos práticos e desafios
        - IA na prática
        - Certificações
        - Carreira e vagas
        - Comunidades
        - Outra (descreva abaixo)
    validations:
      required: true
  - type: textarea
    id: porque
    attributes:
      label: Por que incluir?
      description: Uma ou duas linhas sobre o que é e por que vale o clique. Diga se é gratuito, pago ou em inglês.
    validations:
      required: true
  - type: checkboxes
    id: criterios
    attributes:
      label: Confirmação
      options:
        - label: O link está funcionando e o conteúdo é legal (não é material pirateado).
          required: true
